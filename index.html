<style>
  :root {
    --bg: #121834;
    --text: #F3F5FB;
    --hover: rgba(255, 255, 255, 0.08);
    --sheet: #1B2344;
    --line: rgba(255, 255, 255, 0.12);
    --panel: #E4E9F4;
    --panel-ink: #1B2340;
    --panel-soft: #65708F;
    --panel-shadow: inset 0 3px 8px rgba(27, 35, 64, 0.18);
    --err: #B3341F;
    --hi: rgba(255, 255, 255, 0.10);
    --kt: #F3F5FB;
    --num: #354072;   --num-e: #222B54;
    --fn: #262F59;    --fn-e: #171E3D;
    --util: #4A2F4F;  --util-e: #2F1D34;
    --op: #F2A93B;    --op-e: #B77A1C;  --op-t: #2A1B00;
    --eq: #3FC8A8;    --eq-e: #218A72;  --eq-t: #04261D;
    --mem: #9AA5D1;
    --font: "Avenir Next", "Segoe UI Variable Display", "SF Pro Display", "Helvetica Neue", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: dark;
  }

  [data-theme="light"] {
    --bg: #E7EBF3;
    --text: #1B2340;
    --hover: rgba(27, 35, 64, 0.08);
    --sheet: #FFFFFF;
    --line: rgba(27, 35, 64, 0.12);
    --panel: #FFFFFF;
    --panel-shadow: 0 1px 0 rgba(255, 255, 255, 0.8) inset, 0 4px 14px rgba(27, 35, 64, 0.12);
    --hi: rgba(255, 255, 255, 0.7);
    --kt: #1B2340;
    --num: #FFFFFF;   --num-e: #BFC7DB;
    --fn: #D9DFEE;    --fn-e: #AEB8D2;
    --util: #F4D6DC;  --util-e: #D0A6AF;
    --mem: #4A5687;
    color-scheme: light;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }

  .app {
    height: 100vh;
    height: 100dvh;
    max-width: 1180px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding:
      max(8px, env(safe-area-inset-top))
      max(12px, env(safe-area-inset-right))
      max(14px, env(safe-area-inset-bottom))
      max(12px, env(safe-area-inset-left));
  }

  /* ---------- Top bar ---------- */
  .bar { flex: 0 0 44px; display: flex; align-items: center; gap: 4px; }
  .bar .spacer { flex: 1; }

  .ib {
    width: 44px; height: 44px;
    border: 0; border-radius: 14px;
    background: transparent; color: var(--text);
    display: grid; place-items: center;
    cursor: pointer; font: inherit;
    touch-action: manipulation;
  }
  .ib:hover { background: var(--hover); }
  .ib svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ib.fx { font-size: 1.15rem; font-style: italic; font-weight: 600; font-family: Georgia, "Times New Roman", serif; }
  .ib.on { background: var(--op); color: var(--op-t); }
  .ib:focus-visible, .k:focus-visible, .result:focus-visible, .h-item:focus-visible, .h-btn:focus-visible {
    outline: 3px solid var(--text); outline-offset: 2px;
  }

  /* ---------- Display ---------- */
  .display {
    flex: 0 1 25%;
    min-height: 104px;
    max-height: 300px;
    background: var(--panel);
    color: var(--panel-ink);
    border-radius: 24px;
    padding: 10px 18px 12px;
    display: flex;
    flex-direction: column;
    box-shadow: var(--panel-shadow);
    overflow: hidden;
  }
  .badges { display: flex; gap: 10px; min-height: 20px; font-size: 0.8rem; font-weight: 600; color: var(--panel-soft); }

  .exprBox {
    flex: 1 1 0; min-height: 0;
    display: flex; align-items: flex-end; justify-content: flex-end;
    overflow: hidden;
  }
  .expr {
    max-width: 100%;
    text-align: right;
    font-size: 44px;
    font-weight: 300;
    line-height: 1.15;
    letter-spacing: -0.01em;
    word-break: break-all;
    font-variant-numeric: tabular-nums;
  }
  .display.done .expr { color: var(--panel-soft); font-weight: 400; letter-spacing: 0; }

  .result {
    display: block; width: 100%;
    background: none; border: 0; font: inherit; cursor: pointer;
    padding: 0; margin-top: 4px;
    text-align: right;
    white-space: nowrap; overflow: hidden;
    font-size: 26px; line-height: 1.25;
    font-weight: 400;
    color: var(--panel-soft);
    min-height: 1.25em;
    font-variant-numeric: tabular-nums;
  }
  .display.done .result { color: var(--panel-ink); font-weight: 300; letter-spacing: -0.02em; }
  .result.err { color: var(--err); font-weight: 500; }

  /* ---------- Keys ---------- */
  .pad { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
  .mem  { flex: 0 0 36px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .sci  { flex: 3.7 1 0; min-height: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .main { flex: 5.6 1 0; min-height: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(5, minmax(0, 1fr)); gap: 10px; }
  .app.basic .sci { display: none; }

  .k {
    --kbg: var(--num); --ke: var(--num-e); --kc: var(--kt);
    font: inherit;
    font-weight: 500;
    color: var(--kc);
    background: var(--kbg);
    border: 0;
    border-radius: 16px;
    padding: 0;
    min-width: 0; min-height: 0;
    cursor: pointer;
    box-shadow: 0 1px 0 var(--hi) inset, 0 4px 0 var(--ke);
    transition: transform 0.06s ease, box-shadow 0.06s ease, filter 0.15s ease;
    touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
  }
  .k:hover { filter: brightness(1.1); }
  .k:active, .k.pressed { transform: translateY(3px); box-shadow: 0 1px 0 var(--hi) inset, 0 1px 0 var(--ke); }

  .main .k { font-size: clamp(1.3rem, min(4vh, 6.5vw), 2.2rem); }
  .sci .k  { font-size: clamp(0.85rem, min(2.4vh, 3.6vw), 1.3rem); border-radius: 14px; --kbg: var(--fn); --ke: var(--fn-e); }
  .k.util { --kbg: var(--util); --ke: var(--util-e); }
  .k.op   { --kbg: var(--op); --ke: var(--op-e); --kc: var(--op-t); }
  .main .k.op { font-size: clamp(1.5rem, min(4.6vh, 7vw), 2.5rem); }
  .k.eq   { --kbg: var(--eq); --ke: var(--eq-e); --kc: var(--eq-t); }
  .sci .k.on { --kbg: var(--op); --kc: var(--op-t); --ke: var(--op-e); }

  .mem .k {
    background: transparent; box-shadow: none; border-radius: 10px;
    color: var(--mem); font-size: 0.95rem; font-weight: 600;
  }
  .mem .k:hover { background: var(--hover); filter: none; }
  .mem .k:active, .mem .k.pressed { transform: none; background: var(--hover); box-shadow: none; }

  /* ---------- Wide screens & landscape ---------- */
  @media (min-aspect-ratio: 1/1) {
    .bar { flex-basis: 40px; }
    .display { flex-basis: 24%; min-height: 84px; }
    .pad { display: grid; grid-template-columns: 1.35fr 1fr; grid-template-rows: 34px minmax(0, 1fr); gap: 8px 14px; }
    .mem  { grid-column: 1 / -1; grid-row: 1; flex: none; }
    .sci  { grid-column: 1; grid-row: 2; }
    .main { grid-column: 2; grid-row: 2; }
    .app.basic .main { grid-column: 1 / -1; }
  }

  /* ---------- History ---------- */
  .scrim {
    position: fixed; inset: 0; z-index: 9;
    background: rgba(10, 14, 30, 0.5);
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .scrim.show { opacity: 1; pointer-events: auto; }

  .history {
    position: fixed; top: 0; bottom: 0; right: 0; z-index: 10;
    width: min(100%, 420px);
    background: var(--sheet); color: var(--text);
    display: flex; flex-direction: column;
    padding: max(12px, env(safe-area-inset-top)) 14px max(12px, env(safe-area-inset-bottom));
    transform: translateX(100%);
    visibility: hidden;
    transition: transform 0.22s ease, visibility 0s linear 0.22s;
    box-shadow: -12px 0 40px rgba(0, 0, 0, 0.25);
  }
  .history.show { transform: none; visibility: visible; transition: transform 0.22s ease; }
  .h-head { display: flex; align-items: center; gap: 8px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .h-head h2 { flex: 1; font-size: 1.2rem; font-weight: 600; }
  .h-btn {
    font: inherit; font-weight: 600; color: var(--text);
    background: transparent; border: 2px solid var(--line);
    border-radius: 999px; padding: 8px 16px; cursor: pointer;
  }
  .h-btn:hover { background: var(--hover); }
  .h-list { list-style: none; flex: 1; overflow-y: auto; padding-top: 6px; }
  .h-item {
    display: block; width: 100%; text-align: right;
    background: none; border: 0; border-bottom: 1px solid var(--line);
    color: inherit; font: inherit; cursor: pointer;
    padding: 14px 6px;
  }
  .h-item:hover { background: var(--hover); }
  .h-expr { font-size: 0.95rem; color: var(--mem); word-break: break-all; }
  .h-res { font-size: 1.6rem; font-weight: 300; margin-top: 2px; word-break: break-all; }
  .h-empty { padding: 32px 8px; text-align: center; color: var(--mem); line-height: 1.5; }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 58px); z-index: 20;
    transform: translateX(-50%);
    max-width: min(92vw, 380px);
    background: #1B2340; color: #fff;
    padding: 10px 16px; border-radius: 12px;
    font-size: 0.95rem; text-align: center;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .toast.show { opacity: 1; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
</style>

<script>
/* =====================================================================
   Calculator core: parsing, evaluating and key handling (no DOM here)
   ===================================================================== */
const CalcCore = (function () {
  'use strict';

  class CalcError extends Error {}

  const MAX_HISTORY = 60;
  const MAX_DIGITS = 15;
  const NUM = '(?:\\d+\\.?\\d*|\\.\\d+)(?:e[+-]?\\d+)?';
  const NUM_AT_END = new RegExp('(' + NUM + ')$');
  const NUM_ONLY = new RegExp('^-?' + NUM + '$');
  const TRAIL_OPS = /(?: mod |[+\-*\/^])+$/;
  const NAMES = ['asin', 'acos', 'atan', 'sin', 'cos', 'tan', 'sqrt', 'cbrt', 'abs', 'ln', 'log', 'mod', 'ans'];

  const round12 = n => parseFloat(n.toPrecision(12));

  function numStr(n) {
    let r = round12(n);
    if (Object.is(r, -0)) r = 0;
    if (r !== 0 && Math.abs(r) >= 1e15) return r.toExponential();
    return String(r);
  }

  /* ---------- Formatting for display ---------- */
  const SUP = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '-': '⁻', '+': '' };
  const DISPLAY_RE = new RegExp('(' + '\\d+\\.?\\d*|\\.\\d+' + ')(?:e([+-]?\\d+))?|asin\\(|acos\\(|atan\\(|sqrt\\(|cbrt\\(|[*\\/\\-]|ℯ|ans| mod ', 'g');
  const SWAP = { 'asin(': 'sin⁻¹(', 'acos(': 'cos⁻¹(', 'atan(': 'tan⁻¹(', 'sqrt(': '√(', 'cbrt(': '∛(', '*': '×', '/': '÷', '-': '−', 'ℯ': 'e', 'ans': 'Ans', ' mod ': ' mod ' };

  function formatExpr(s) {
    return String(s).replace(DISPLAY_RE, (m, num, exp) => {
      if (num !== undefined) {
        const parts = num.split('.');
        let out = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        if (num.indexOf('.') !== -1) out += '.' + parts[1];
        if (exp !== undefined) out += '×10' + exp.split('').map(c => SUP[c] || '').join('');
        return out;
      }
      return SWAP[m] !== undefined ? SWAP[m] : m;
    });
  }

  /* ---------- Expression cleanup ---------- */
  function cleanExpr(e) {
    let s = e.replace(TRAIL_OPS, '');
    let open = 0;
    for (const c of s) { if (c === '(') open++; else if (c === ')') open--; }
    if (open > 0) s += ')'.repeat(open);
    return s;
  }
  const isPlainNumber = e => NUM_ONLY.test(e);

  /* ---------- Tokenizer ---------- */
  function tokenize(s, ans) {
    const t = [];
    let i = 0;
    const prevIsValue = () => {
      const p = t[t.length - 1];
      return !!p && (p.k === 'num' || p.k === 'const' || p.k === 'rp' || p.k === 'post');
    };
    const numRe = new RegExp('^' + NUM);
    while (i < s.length) {
      const c = s[i];
      if (c === ' ') { i++; continue; }
      const m = s.slice(i).match(numRe);
      if (m) {
        if (prevIsValue()) t.push({ k: 'op', v: '*' });
        t.push({ k: 'num', v: parseFloat(m[0]) });
        i += m[0].length;
        continue;
      }
      if (c === 'π' || c === 'ℯ') {
        if (prevIsValue()) t.push({ k: 'op', v: '*' });
        t.push({ k: 'const', v: c === 'π' ? Math.PI : Math.E });
        i++;
        continue;
      }
      if ('+-*/^'.indexOf(c) !== -1) { t.push({ k: 'op', v: c }); i++; continue; }
      if (c === '(') {
        if (prevIsValue()) t.push({ k: 'op', v: '*' });
        t.push({ k: 'lp' });
        i++;
        continue;
      }
      if (c === ')') { t.push({ k: 'rp' }); i++; continue; }
      if (c === '!' || c === '%') { t.push({ k: 'post', v: c }); i++; continue; }
      const name = NAMES.find(n => s.startsWith(n, i));
      if (name) {
        i += name.length;
        if (name === 'mod') { t.push({ k: 'op', v: 'mod' }); continue; }
        if (prevIsValue()) t.push({ k: 'op', v: '*' });
        if (name === 'ans') { t.push({ k: 'const', v: ans }); continue; }
        if (s[i] !== '(') throw new CalcError('Invalid expression');
        t.push({ k: 'fn', v: name });
        t.push({ k: 'lp' });
        i++;
        continue;
      }
      throw new CalcError('Invalid expression');
    }
    return t;
  }

  function factorial(n) {
    if (!Number.isInteger(round12(n)) || n < 0) throw new CalcError('Invalid input');
    n = Math.round(n);
    if (n > 170) throw new CalcError('Result too large');
    let r = 1;
    for (let i = 2; i <= n; i++) r *= i;
    return r;
  }

  /* ---------- Evaluator (recursive descent, no eval) ---------- */
  function evaluate(input, opts) {
    const deg = !!(opts && opts.deg);
    const ans = (opts && opts.ans) || 0;
    const toRad = x => (deg ? x * Math.PI / 180 : x);
    const fromRad = x => (deg ? x * 180 / Math.PI : x);
    const cleanTrig = v => (Math.abs(v) < 1e-14 ? 0 : v);

    const toks = tokenize(cleanExpr(input), ans);
    if (!toks.length) throw new CalcError('Invalid expression');
    let depth = 0;
    for (const tk of toks) {
      if (tk.k === 'lp') depth++;
      if (tk.k === 'rp' && --depth < 0) throw new CalcError('Invalid expression');
    }

    let p = 0;
    const peek = () => toks[p];
    const isOp = (...vals) => { const t = toks[p]; return !!t && t.k === 'op' && vals.indexOf(t.v) !== -1; };

    function applyFn(name, x) {
      switch (name) {
        case 'sin': return cleanTrig(Math.sin(toRad(x)));
        case 'cos': return cleanTrig(Math.cos(toRad(x)));
        case 'tan': {
          if (Math.abs(Math.cos(toRad(x))) < 1e-14) throw new CalcError('Undefined');
          return cleanTrig(Math.tan(toRad(x)));
        }
        case 'asin': if (x < -1 || x > 1) throw new CalcError('Invalid input'); return fromRad(Math.asin(x));
        case 'acos': if (x < -1 || x > 1) throw new CalcError('Invalid input'); return fromRad(Math.acos(x));
        case 'atan': return fromRad(Math.atan(x));
        case 'ln':   if (x <= 0) throw new CalcError('Invalid input'); return Math.log(x);
        case 'log':  if (x <= 0) throw new CalcError('Invalid input'); return Math.log10(x);
        case 'sqrt': if (x < 0) throw new CalcError('Invalid input'); return Math.sqrt(x);
        case 'cbrt': return Math.cbrt(x);
        case 'abs':  return Math.abs(x);
      }
      throw new CalcError('Invalid expression');
    }

    function parseExpr() {
      const first = parseTerm();
      let val = first.v;
      let more = false;
      while (isOp('+', '-')) {
        const op = toks[p++].v;
        const r = parseTerm();
        more = true;
        const rv = r.pct ? val * r.v : r.v;   // 200 + 10% means 200 + 10% of 200
        val = op === '+' ? val + rv : val - rv;
      }
      return { v: val, pct: more ? false : first.pct };
    }

    function parseTerm() {
      const first = parseUnary();
      let val = first.v;
      let more = false;
      while (isOp('*', '/', 'mod')) {
        const op = toks[p++].v;
        const r = parseUnary();
        more = true;
        if (op === '*') val *= r.v;
        else {
          if (round12(r.v) === 0) throw new CalcError("Can't divide by zero");
          val = op === '/' ? val / r.v : val % r.v;
        }
      }
      return { v: val, pct: more ? false : first.pct };
    }

    function parseUnary() {
      if (isOp('-')) { p++; const r = parseUnary(); return { v: -r.v, pct: false }; }
      if (isOp('+')) { p++; return parseUnary(); }
      return parsePower();
    }

    function parsePower() {
      const base = parsePostfix();
      if (isOp('^')) {
        p++;
        const ex = parseUnary();
        const v = Math.pow(base.v, ex.v);
        if (Number.isNaN(v)) throw new CalcError('Invalid input');
        if (!Number.isFinite(v)) throw new CalcError(base.v === 0 ? "Can't divide by zero" : 'Result too large');
        return { v, pct: false };
      }
      return base;
    }

    function parsePostfix() {
      let x = parsePrimary();
      while (peek() && peek().k === 'post') {
        const c = toks[p++].v;
        x = c === '!' ? { v: factorial(x.v), pct: false } : { v: x.v / 100, pct: true };
      }
      return x;
    }

    function expectRp() {
      if (!peek() || peek().k !== 'rp') throw new CalcError('Invalid expression');
      p++;
    }

    function parsePrimary() {
      const t = toks[p++];
      if (!t) throw new CalcError('Invalid expression');
      if (t.k === 'num' || t.k === 'const') return { v: t.v, pct: false };
      if (t.k === 'lp') { const r = parseExpr(); expectRp(); return { v: r.v, pct: false }; }
      if (t.k === 'fn') {
        if (!peek() || peek().k !== 'lp') throw new CalcError('Invalid expression');
        p++;
        const r = parseExpr();
        expectRp();
        return { v: applyFn(t.v, r.v), pct: false };
      }
      throw new CalcError('Invalid expression');
    }

    const res = parseExpr();
    if (p < toks.length) throw new CalcError('Invalid expression');
    if (!Number.isFinite(res.v)) throw new CalcError('Result too large');
    return res.v;
  }

  /* ---------- State & key handling ---------- */
  function createState() {
    return { expr: '', done: false, lastExpr: '', error: '', ans: 0, mem: 0, deg: true, inv: false, sci: true, theme: 'dark', history: [] };
  }

  const tailNumber = e => (e.match(/\d*\.?\d*$/) || [''])[0];
  const endsWithValue = e => /(?:[\d.)!%πℯ]|ans)$/.test(e);

  function prepare(S, kind) {
    S.error = '';
    if (S.done) {
      if (kind === 'digit' || kind === 'dot' || kind === 'fn' || kind === 'const' || kind === 'lp') S.expr = '';
      S.done = false;
    }
  }

  function insertValue(S, text) {
    if (/[\d.]$/.test(S.expr)) S.expr += '*';
    S.expr += text;
  }

  function currentValue(S) {
    if (S.done) return S.ans;
    if (S.expr === '') return null;
    try { return evaluate(S.expr, S); } catch (e) { return null; }
  }

  function preview(S) {
    if (S.done || S.expr === '') return '';
    const e = cleanExpr(S.expr);
    if (isPlainNumber(e)) return '';
    try { return numStr(evaluate(e, S)); } catch (err) { return ''; }
  }

  function inputOp(S, op) {
    prepare(S, 'op');
    const e = S.expr;
    const opStr = op === 'mod' ? ' mod ' : op;
    if (e === '') { if (op === '-') S.expr = '-'; return; }
    const tail = e.match(TRAIL_OPS);
    if (tail) {
      if (op === '-' && /^(?: mod |[*\/^])$/.test(tail[0])) { S.expr = e + '-'; return; }   // 5 × −3
      const base = e.slice(0, -tail[0].length);
      if (base === '' || base.endsWith('(')) { S.expr = op === '-' ? base + '-' : base; return; }
      S.expr = base + opStr;
      return;
    }
    if (e.endsWith('(')) { if (op === '-') S.expr = e + '-'; return; }
    S.expr = e + opStr;
  }

  function useValue(S, text) {
    prepare(S, 'const');
    if (S.expr === '') S.expr = text;
    else insertValue(S, text.charAt(0) === '-' ? '(' + text + ')' : text);
  }

  function press(S, act, v) {
    switch (act) {
      case 'digit': {
        prepare(S, 'digit');
        const tail = tailNumber(S.expr);
        if (tail === '0') S.expr = S.expr.slice(0, -1) + v;
        else if (tail.replace('.', '').length < MAX_DIGITS) S.expr += v;
        return null;
      }
      case 'dot': {
        prepare(S, 'dot');
        const tail = tailNumber(S.expr);
        if (tail.indexOf('.') !== -1) return null;
        S.expr += tail === '' ? '0.' : '.';
        return null;
      }
      case 'op': inputOp(S, v); return null;
      case 'ins': prepare(S, 'fn'); S.expr += v; return null;
      case 'const': prepare(S, 'const'); S.expr += v; return null;
      case 'lp': prepare(S, 'lp'); S.expr += '('; return null;
      case 'rp': {
        prepare(S, 'rp');
        let open = 0;
        for (const c of S.expr) { if (c === '(') open++; else if (c === ')') open--; }
        if (open > 0 && endsWithValue(S.expr)) S.expr += ')';
        return null;
      }
      case 'post': {
        prepare(S, 'post');
        if (endsWithValue(S.expr)) S.expr += v;
        return null;
      }
      case 'recip': {
        prepare(S, 'post');
        const m = S.expr.match(NUM_AT_END);
        if (m) S.expr = S.expr.slice(0, -m[0].length) + '1/(' + m[0] + ')';
        else if (S.expr.endsWith(')')) S.expr += '^(-1)';
        else S.expr += '1/(';
        return null;
      }
      case 'rand': {
        prepare(S, 'const');
        insertValue(S, String(round12(Math.random())));
        return null;
      }
      case 'sign': {
        prepare(S, 'post');
        const e = S.expr;
        if (e === '') { S.expr = '-'; return null; }
        if (e === '-') { S.expr = ''; return null; }
        let m = e.match(new RegExp('\\(-(' + NUM + ')$'));
        if (m) { S.expr = e.slice(0, -m[0].length) + m[1]; return null; }
        m = e.match(NUM_AT_END);
        if (m) {
          const start = e.length - m[0].length;
          if (start === 0) S.expr = '-' + m[1];
          else if (e.slice(0, start) === '-') S.expr = m[1];
          else S.expr = e.slice(0, start) + '(-' + m[1];
        }
        return null;
      }
      case 'clear': S.expr = ''; S.done = false; S.error = ''; return null;
      case 'del': {
        S.error = '';
        S.done = false;
        const m = S.expr.match(/(?:asin\(|acos\(|atan\(|sin\(|cos\(|tan\(|sqrt\(|cbrt\(|abs\(|ln\(|log\(| mod |ans)$/);
        S.expr = S.expr.slice(0, m ? -m[0].length : -1);
        return null;
      }
      case 'eq': {
        if (S.done || S.expr === '') return null;
        const e = cleanExpr(S.expr);
        if (e === '' || isPlainNumber(e)) return null;
        try {
          const val = evaluate(e, S);
          const rs = numStr(val);
          S.history.unshift({ e: e, r: rs });
          if (S.history.length > MAX_HISTORY) S.history.length = MAX_HISTORY;
          S.lastExpr = e;
          S.expr = rs;
          S.ans = Number(rs);
          S.done = true;
          S.error = '';
        } catch (err) {
          S.error = err instanceof CalcError ? err.message : 'Error';
        }
        return null;
      }
      case 'mem': {
        if (v === 'mc') { S.mem = 0; return 'Memory cleared'; }
        if (v === 'mr') {
          prepare(S, 'const');
          const t = numStr(S.mem);
          insertValue(S, S.mem < 0 ? '(' + t + ')' : t);
          return null;
        }
        const cur = currentValue(S);
        if (cur === null) return 'Enter a number first';
        if (v === 'mplus') S.mem = round12(S.mem + cur);
        else if (v === 'mminus') S.mem = round12(S.mem - cur);
        else if (v === 'ms') S.mem = round12(cur);
        return 'Memory: ' + formatExpr(numStr(S.mem));
      }
      case 'toggle': {
        if (v === 'inv') S.inv = !S.inv;
        else if (v === 'deg') S.deg = !S.deg;
        else if (v === 'sci') S.sci = !S.sci;
        else if (v === 'theme') S.theme = S.theme === 'dark' ? 'light' : 'dark';
        return null;
      }
    }
    return null;
  }

  return { CalcError, createState, press, preview, evaluate, cleanExpr, numStr, formatExpr, useValue, isPlainNumber, MAX_HISTORY };
})();
</script>

<script>
/* =====================================================================
   Interface: rendering, events, install & full screen
   ===================================================================== */
(function () {
  'use strict';

  const $ = id => document.getElementById(id);
  const app = $('app'), display = $('display'), exprEl = $('expr'), resEl = $('result');
  const metaTheme = $('metaTheme');
  const S = CalcCore.createState();
  const STORE = 'calc.v2';

  /* ----- Saved settings, memory and history ----- */
  try {
    const saved = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (saved && typeof saved === 'object') {
      if (typeof saved.mem === 'number') S.mem = saved.mem;
      if (typeof saved.ans === 'number') S.ans = saved.ans;
      if (typeof saved.deg === 'boolean') S.deg = saved.deg;
      if (typeof saved.sci === 'boolean') S.sci = saved.sci;
      if (saved.theme === 'light' || saved.theme === 'dark') S.theme = saved.theme;
      if (Array.isArray(saved.history)) {
        S.history = saved.history
          .filter(h => h && typeof h.e === 'string' && typeof h.r === 'string')
          .slice(0, CalcCore.MAX_HISTORY);
      }
    }
  } catch (e) { /* storage unavailable */ }

  function save() {
    try {
      localStorage.setItem(STORE, JSON.stringify({ mem: S.mem, ans: S.ans, deg: S.deg, sci: S.sci, theme: S.theme, history: S.history }));
    } catch (e) { /* ignore */ }
  }

  /* ----- Text fitting ----- */
  function fitW(el, max, min) {
    let s = max;
    el.style.fontSize = s + 'px';
    while (s > min && el.scrollWidth > el.clientWidth) { s -= 2; el.style.fontSize = s + 'px'; }
  }
  function fitH(el, max, min) {
    const box = el.parentElement;
    let s = max;
    el.style.fontSize = s + 'px';
    while (s > min && el.offsetHeight > box.clientHeight) { s -= 2; el.style.fontSize = s + 'px'; }
  }

  /* ----- Render ----- */
  function render() {
    document.documentElement.dataset.theme = S.theme;
    metaTheme.content = S.theme === 'light' ? '#E7EBF3' : '#121834';
    app.classList.toggle('basic', !S.sci);
    $('fxBtn').classList.toggle('on', S.sci);
    $('fxBtn').setAttribute('aria-pressed', String(S.sci));
    $('badgeAngle').textContent = S.deg ? 'DEG' : 'RAD';
    $('badgeAngle').hidden = !S.sci;
    $('badgeMem').hidden = S.mem === 0;
    $('degKey').textContent = S.deg ? 'DEG' : 'RAD';
    $('invKey').classList.toggle('on', S.inv);
    $('invKey').setAttribute('aria-pressed', String(S.inv));
    document.querySelectorAll('[data-il]').forEach(b => { b.textContent = S.inv ? b.dataset.il : b.dataset.l; });

    display.classList.toggle('done', S.done);
    let announce;
    if (S.done) {
      exprEl.textContent = CalcCore.formatExpr(CalcCore.cleanExpr(S.lastExpr)) + ' =';
      resEl.textContent = CalcCore.formatExpr(S.expr);
      resEl.classList.remove('err');
      announce = resEl.textContent;
    } else {
      exprEl.textContent = S.expr === '' ? '0' : CalcCore.formatExpr(S.expr);
      const pv = S.error ? S.error : CalcCore.preview(S);
      resEl.textContent = S.error ? S.error : (pv ? CalcCore.formatExpr(pv) : '');
      resEl.classList.toggle('err', !!S.error);
      announce = resEl.textContent;
    }
    $('sr').textContent = announce;

    const h = display.clientHeight;
    if (S.done) {
      fitH(exprEl, 20, 12);
      fitW(resEl, Math.max(34, Math.min(76, h * 0.38)), 26);
    } else {
      fitH(exprEl, Math.max(28, Math.min(60, h * 0.3)), 20);
      fitW(resEl, 26, 14);
    }
  }

  /* ----- Toast ----- */
  let toastTimer = null;
  function toast(msg, ms) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), ms || 1600);
  }

  function buzz() { try { if (navigator.vibrate) navigator.vibrate(6); } catch (e) { /* ignore */ } }

  /* ----- Keys ----- */
  function handle(act, value, usedInv) {
    const msg = CalcCore.press(S, act, value);
    if (usedInv) S.inv = false;
    render();
    save();
    if (msg) toast(msg);
  }

  $('pad').addEventListener('click', e => {
    const b = e.target.closest('button[data-a]');
    if (!b) return;
    buzz();
    const useInv = S.inv && !!b.dataset.iv;
    handle(b.dataset.a, useInv ? b.dataset.iv : b.dataset.v, useInv);
  });

  $('fxBtn').addEventListener('click', () => handle('toggle', 'sci'));
  $('themeBtn').addEventListener('click', () => handle('toggle', 'theme'));

  /* ----- Copy result ----- */
  resEl.addEventListener('click', () => {
    let text = '';
    if (S.done) text = S.expr;
    else if (!S.error) text = CalcCore.preview(S) || (CalcCore.isPlainNumber(S.expr) ? S.expr : '');
    if (!text) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        () => toast('Copied ' + CalcCore.formatExpr(text)),
        () => toast("Couldn't copy")
      );
    } else {
      toast('Copy is not available here');
    }
  });

  /* ----- History panel ----- */
  const hist = $('history'), scrim = $('scrim'), list = $('histList');

  function renderHistory() {
    list.textContent = '';
    if (!S.history.length) {
      const li = document.createElement('li');
      li.className = 'h-empty';
      li.textContent = 'No calculations yet. Results you calculate appear here.';
      list.appendChild(li);
      return;
    }
    S.history.forEach(item => {
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.className = 'h-item';
      b.type = 'button';
      const ex = document.createElement('div');
      ex.className = 'h-expr';
      ex.textContent = CalcCore.formatExpr(item.e);
      const rs = document.createElement('div');
      rs.className = 'h-res';
      rs.textContent = '= ' + CalcCore.formatExpr(item.r);
      b.appendChild(ex);
      b.appendChild(rs);
      b.addEventListener('click', () => {
        CalcCore.useValue(S, item.r);
        closeHistory();
        render();
      });
      li.appendChild(b);
      list.appendChild(li);
    });
  }

  function openHistory() {
    renderHistory();
    hist.classList.add('show');
    scrim.classList.add('show');
    $('closeHist').focus();
  }
  function closeHistory() {
    hist.classList.remove('show');
    scrim.classList.remove('show');
    $('histBtn').focus({ preventScroll: true });
  }
  const historyOpen = () => hist.classList.contains('show');

  $('histBtn').addEventListener('click', openHistory);
  $('closeHist').addEventListener('click', closeHistory);
  scrim.addEventListener('click', closeHistory);
  $('clearHist').addEventListener('click', () => { S.history = []; save(); renderHistory(); });

  /* ----- Keyboard ----- */
  function flash(kb) {
    const btn = document.querySelector('.k[data-kb="' + kb + '"]');
    if (!btn) return;
    btn.classList.add('pressed');
    setTimeout(() => btn.classList.remove('pressed'), 110);
  }

  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (historyOpen()) {
      if (e.key === 'Escape') { e.preventDefault(); closeHistory(); }
      return;
    }
    const k = e.key;
    let act = null, val = null, kb = k;
    if (/^[0-9]$/.test(k)) { act = 'digit'; val = k; }
    else if (k === '.' || k === ',') { act = 'dot'; kb = '.'; }
    else if (k === '+' || k === '-' || k === '*' || k === '/') { act = 'op'; val = k; }
    else if (k === 'x' || k === 'X') { act = 'op'; val = '*'; kb = '*'; }
    else if (k === '^') { act = 'op'; val = '^'; }
    else if (k === '(') { act = 'lp'; }
    else if (k === ')') { act = 'rp'; }
    else if (k === '%') { act = 'post'; val = '%'; }
    else if (k === '!') { act = 'post'; val = '!'; }
    else if (k === 'Enter' || k === '=') { act = 'eq'; kb = 'Enter'; }
    else if (k === 'Backspace') { act = 'del'; }
    else if (k === 'Escape' || k === 'Delete' || k === 'c' || k === 'C') { act = 'clear'; kb = 'Escape'; }
    else if (k === 'p' || k === 'P') { act = 'const'; val = 'π'; kb = 'p'; }
    else if (k === 'e' || k === 'E') { act = 'const'; val = 'ℯ'; kb = 'e'; }
    if (!act) return;
    e.preventDefault();
    flash(kb);
    handle(act, val, false);
  });

  /* ----- Install and full screen ----- */
  const installBtn = $('installBtn'), fsBtn = $('fsBtn');
  const standalone = window.matchMedia('(display-mode: standalone)').matches ||
                     window.matchMedia('(display-mode: fullscreen)').matches ||
                     navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let deferredPrompt = null;

  if (!standalone) {
    if (isIOS) installBtn.hidden = false;
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.hidden = false;
    });
    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        installBtn.hidden = true;
      } else if (isIOS) {
        toast('To install: tap Share, then Add to Home Screen.', 4500);
      }
    });
    window.addEventListener('appinstalled', () => { installBtn.hidden = true; });

    if (document.fullscreenEnabled) {
      fsBtn.hidden = false;
      fsBtn.addEventListener('click', () => {
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen().catch(() => toast('Full screen is not available here'));
      });
    }
  }

  /* ----- Start ----- */
  let resizeQueued = false;
  window.addEventListener('resize', () => {
    if (resizeQueued) return;
    resizeQueued = true;
    requestAnimationFrame(() => { resizeQueued = false; render(); });
  });

  render();
})();
</script>
</body>
</html>
