<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calculator">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Calculator</title>
<style>
  :root {
    --page: #E7EBF3;
    --body: #1B2340;
    --body-edge: #10162B;
    --key: #2B3560;
    --key-edge: #1A2246;
    --key-num: #354072;
    --key-num-edge: #222B54;
    --key-util: #4A2F4F;
    --key-util-edge: #2F1D34;
    --amber: #F2A93B;
    --amber-edge: #B77A1C;
    --mint: #3FC8A8;
    --mint-edge: #218A72;
    --panel: #E4E9F4;
    --panel-ink: #1B2340;
    --panel-soft: #6A7395;
    --text: #F3F5FB;
    --font: "Avenir Next", "Segoe UI Variable Display", "SF Pro Display", "Helvetica Neue", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; overscroll-behavior: none; }

  body {
    font-family: var(--font);
    background: var(--page);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent;
  }

  .calculator {
    width: min(100%, 380px);
    background: var(--body);
    border-radius: 32px;
    padding: 20px;
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.08) inset,
      0 30px 60px -20px rgba(27, 35, 64, 0.55),
      0 8px 0 var(--body-edge);
  }

  /* ---------- Display ---------- */
  .display {
    background: var(--panel);
    color: var(--panel-ink);
    border-radius: 20px;
    padding: 16px 20px 18px;
    margin-bottom: 20px;
    min-height: 132px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: flex-end;
    overflow: hidden;
    box-shadow: 0 3px 8px rgba(27, 35, 64, 0.18) inset;
  }

  .expression {
    font-size: 1rem;
    color: var(--panel-soft);
    min-height: 1.5em;
    max-width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-variant-numeric: tabular-nums;
  }

  .result {
    --base: clamp(2.6rem, 13vw, 3.6rem);
    --scale: 1;
    font-size: calc(var(--base) * var(--scale));
    font-weight: 300;
    letter-spacing: -0.02em;
    line-height: 1.1;
    max-width: 100%;
    white-space: nowrap;
    overflow: hidden;
    font-variant-numeric: tabular-nums;
    text-align: right;
  }

  .result.is-error {
    --base: 1.35rem;
    font-weight: 500;
    letter-spacing: 0;
    color: #B3341F;
    white-space: normal;
  }

  /* ---------- Keys ---------- */
  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: clamp(58px, 15vw, 68px);
    gap: 12px;
  }

  .key {
    font: inherit;
    font-size: 1.5rem;
    font-weight: 500;
    color: var(--text);
    background: var(--key);
    border: 0;
    border-radius: 18px;
    cursor: pointer;
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.1) inset,
      0 4px 0 var(--key-edge);
    transition: transform 0.06s ease, box-shadow 0.06s ease, filter 0.15s ease;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }

  .key:hover { filter: brightness(1.12); }

  .key:active,
  .key.pressed {
    transform: translateY(3px);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.1) inset, 0 1px 0 var(--key-edge);
  }

  .key:focus-visible {
    outline: 3px solid #fff;
    outline-offset: 2px;
  }

  .key.num  { background: var(--key-num); box-shadow: 0 1px 0 rgba(255,255,255,0.1) inset, 0 4px 0 var(--key-num-edge); }
  .key.num:active, .key.num.pressed { box-shadow: 0 1px 0 rgba(255,255,255,0.1) inset, 0 1px 0 var(--key-num-edge); }

  .key.util { background: var(--key-util); font-size: 1.2rem; box-shadow: 0 1px 0 rgba(255,255,255,0.1) inset, 0 4px 0 var(--key-util-edge); }
  .key.util:active, .key.util.pressed { box-shadow: 0 1px 0 rgba(255,255,255,0.1) inset, 0 1px 0 var(--key-util-edge); }

  .key.op {
    background: var(--amber);
    color: #2A1B00;
    font-size: 1.75rem;
    box-shadow: 0 1px 0 rgba(255,255,255,0.35) inset, 0 4px 0 var(--amber-edge);
  }
  .key.op:active, .key.op.pressed { box-shadow: 0 1px 0 rgba(255,255,255,0.35) inset, 0 1px 0 var(--amber-edge); }
  .key.op.active-op { outline: 3px solid #fff; outline-offset: 2px; }

  .key.equals {
    grid-row: span 2;
    background: var(--mint);
    color: #04261D;
    font-size: 2rem;
    box-shadow: 0 1px 0 rgba(255,255,255,0.35) inset, 0 4px 0 var(--mint-edge);
  }
  .key.equals:active, .key.equals.pressed { box-shadow: 0 1px 0 rgba(255,255,255,0.35) inset, 0 1px 0 var(--mint-edge); }

  .key.zero { grid-column: span 2; }

  /* ---------- Install bar ---------- */
  .install {
    display: none;
    width: min(100%, 380px);
    margin-top: 22px;
    text-align: center;
    color: #3A4468;
    font-size: 0.95rem;
    line-height: 1.5;
  }
  .install.show { display: block; }
  .install button {
    font: inherit;
    font-weight: 600;
    color: var(--body);
    background: transparent;
    border: 2px solid var(--body);
    border-radius: 999px;
    padding: 10px 22px;
    cursor: pointer;
  }
  .install button:focus-visible { outline: 3px solid var(--body); outline-offset: 3px; }
  .install button[hidden] { display: none; }

  @media (max-width: 360px) {
    .calculator { padding: 14px; border-radius: 26px; }
    .keys { gap: 9px; }
    .display { padding: 12px 16px 14px; min-height: 116px; }
  }

  @media (max-height: 640px) {
    .display { min-height: 100px; margin-bottom: 14px; }
    .keys { grid-auto-rows: 52px; gap: 9px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .key { transition: none; }
  }
</style>
</head>
<body>

<main class="calculator" aria-label="Calculator">
  <section class="display" aria-live="polite" aria-atomic="true">
    <div class="expression" id="expression"></div>
    <div class="result" id="result">0</div>
  </section>

  <section class="keys" aria-label="Calculator keys">
    <button class="key util" data-action="clear"  data-key="Escape"    aria-label="Clear all">C</button>
    <button class="key util" data-action="delete" data-key="Backspace" aria-label="Delete last digit">DEL</button>
    <button class="key op"   data-action="operator" data-value="/" data-key="/" aria-label="Divide">÷</button>
    <button class="key op"   data-action="operator" data-value="*" data-key="*" aria-label="Multiply">×</button>

    <button class="key num" data-action="digit" data-value="7" data-key="7">7</button>
    <button class="key num" data-action="digit" data-value="8" data-key="8">8</button>
    <button class="key num" data-action="digit" data-value="9" data-key="9">9</button>
    <button class="key op"  data-action="operator" data-value="-" data-key="-" aria-label="Subtract">−</button>

    <button class="key num" data-action="digit" data-value="4" data-key="4">4</button>
    <button class="key num" data-action="digit" data-value="5" data-key="5">5</button>
    <button class="key num" data-action="digit" data-value="6" data-key="6">6</button>
    <button class="key op"  data-action="operator" data-value="+" data-key="+" aria-label="Add">+</button>

    <button class="key num" data-action="digit" data-value="1" data-key="1">1</button>
    <button class="key num" data-action="digit" data-value="2" data-key="2">2</button>
    <button class="key num" data-action="digit" data-value="3" data-key="3">3</button>
    <button class="key equals" data-action="equals" data-key="Enter" aria-label="Equals">=</button>

    <button class="key num zero" data-action="digit" data-value="0" data-key="0">0</button>
    <button class="key num" data-action="decimal" data-key="." aria-label="Decimal point">.</button>
  </section>
</main>

<div class="install" id="install">
  <button type="button" id="installBtn" hidden>Install app</button>
  <p id="iosHint" hidden>To install: tap the Share button, then choose Add to Home Screen.</p>
</div>

<script>
(() => {
  'use strict';

  const MAX_DIGITS = 15;
  const SYMBOLS = { '+': '+', '-': '−', '*': '×', '/': '÷' };

  const exprEl = document.getElementById('expression');
  const resultEl = document.getElementById('result');
  const opKeys = document.querySelectorAll('.key.op');

  const state = {
    current: '0',        // string being typed / shown
    previous: null,      // number stored before an operator
    op: null,            // pending operator
    overwrite: false,    // next digit replaces the current value
    lastOp: null,        // for repeated "="
    lastOperand: null,
    expression: '',
    error: false
  };

  /* ---------- Helpers ---------- */

  const toStr = n => String(parseFloat(n.toPrecision(12)));

  function format(str) {
    if (/e|Infinity|NaN/i.test(str)) return str;
    const negative = str.startsWith('-');
    const [int, dec] = (negative ? str.slice(1) : str).split('.');
    const grouped = int.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (negative ? '-' : '') + grouped + (dec !== undefined ? '.' + dec : '');
  }

  function calculate(a, b, op) {
    switch (op) {
      case '+': return a + b;
      case '-': return a - b;
      case '*': return a * b;
      case '/': return b === 0 ? null : a / b;
    }
    return b;
  }

  function showError(message) {
    state.current = message;
    state.previous = null;
    state.op = null;
    state.lastOp = null;
    state.lastOperand = null;
    state.expression = '';
    state.overwrite = true;
    state.error = true;
  }

  function reset() {
    state.current = '0';
    state.previous = null;
    state.op = null;
    state.overwrite = false;
    state.lastOp = null;
    state.lastOperand = null;
    state.expression = '';
    state.error = false;
  }

  /* ---------- Actions ---------- */

  function inputDigit(d) {
    if (state.error) reset();
    if (state.overwrite) {
      state.current = d;
      state.overwrite = false;
      if (!state.op) state.expression = '';
    } else if (state.current === '0') {
      state.current = d;
    } else if (state.current.replace(/[-.]/g, '').length < MAX_DIGITS) {
      state.current += d;
    }
  }

  function inputDecimal() {
    if (state.error) reset();
    if (state.overwrite) {
      state.current = '0.';
      state.overwrite = false;
      if (!state.op) state.expression = '';
    } else if (!state.current.includes('.')) {
      state.current += '.';
    }
  }

  function chooseOperator(op) {
    if (state.error) return;

    // Changing your mind: replace the pending operator
    if (state.op && state.overwrite) {
      state.op = op;
      state.expression = `${format(toStr(state.previous))} ${SYMBOLS[op]}`;
      return;
    }

    const value = parseFloat(state.current);

    if (state.op) {
      // Chain: 2 + 3 × → compute 2 + 3 first
      const result = calculate(state.previous, value, state.op);
      if (result === null) return showError("Can't divide by zero");
      state.previous = result;            // keep full precision internally
      state.current = toStr(result);
    } else {
      state.previous = value;
    }

    state.op = op;
    state.overwrite = true;
    state.expression = `${format(toStr(state.previous))} ${SYMBOLS[op]}`;
  }

  function evaluate() {
    if (state.error) return;

    if (state.op) {
      const a = state.previous;
      const b = parseFloat(state.current);
      const result = calculate(a, b, state.op);
      if (result === null) return showError("Can't divide by zero");

      state.expression = `${format(toStr(a))} ${SYMBOLS[state.op]} ${format(toStr(b))} =`;
      state.lastOp = state.op;
      state.lastOperand = b;
      state.current = toStr(result);
      state.previous = null;
      state.op = null;
      state.overwrite = true;
    } else if (state.lastOp && state.overwrite) {
      // Pressing "=" again repeats the last operation
      const a = parseFloat(state.current);
      const result = calculate(a, state.lastOperand, state.lastOp);
      if (result === null) return showError("Can't divide by zero");

      state.expression = `${format(toStr(a))} ${SYMBOLS[state.lastOp]} ${format(toStr(state.lastOperand))} =`;
      state.current = toStr(result);
    }
  }

  function deleteLast() {
    if (state.error) return reset();
    if (state.overwrite) return; // nothing typed by the user to delete
    state.current = state.current.length > 1 ? state.current.slice(0, -1) : '0';
    if (state.current === '-') state.current = '0';
  }

  /* ---------- Render ---------- */

  function render() {
    const text = state.error ? state.current : format(state.current);
    resultEl.textContent = text;
    resultEl.classList.toggle('is-error', state.error);

    const len = text.length;
    const scale = len <= 8 ? 1 : len <= 11 ? 0.78 : len <= 14 ? 0.6 : 0.48;
    resultEl.style.setProperty('--scale', state.error ? 1 : scale);

    exprEl.textContent = state.expression;

    opKeys.forEach(k => {
      k.classList.toggle('active-op', !!state.op && state.overwrite && k.dataset.value === state.op);
    });
  }

  function handle(action, value) {
    switch (action) {
      case 'digit':    inputDigit(value); break;
      case 'decimal':  inputDecimal(); break;
      case 'operator': chooseOperator(value); break;
      case 'equals':   evaluate(); break;
      case 'delete':   deleteLast(); break;
      case 'clear':    reset(); break;
    }
    render();
  }

  /* ---------- Events ---------- */

  document.querySelector('.keys').addEventListener('click', e => {
    const btn = e.target.closest('.key');
    if (!btn) return;
    handle(btn.dataset.action, btn.dataset.value);
  });

  function flash(keyName) {
    const btn = document.querySelector(`.key[data-key="${CSS.escape(keyName)}"]`);
    if (!btn) return;
    btn.classList.add('pressed');
    setTimeout(() => btn.classList.remove('pressed'), 110);
  }

  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;

    let key = e.key;
    let action = null, value = null;

    if (/^[0-9]$/.test(key)) { action = 'digit'; value = key; }
    else if (key === '.' || key === ',') { action = 'decimal'; key = '.'; }
    else if (['+', '-', '*', '/'].includes(key)) { action = 'operator'; value = key; }
    else if (key === 'x' || key === 'X') { action = 'operator'; value = '*'; key = '*'; }
    else if (key === 'Enter' || key === '=') { action = 'equals'; key = 'Enter'; }
    else if (key === 'Backspace') { action = 'delete'; }
    else if (key === 'Escape' || key === 'Delete' || key === 'c' || key === 'C') { action = 'clear'; key = 'Escape'; }

    if (!action) return;
    e.preventDefault();
    flash(key);
    handle(action, value);
  });

  render();

  /* ---------- Install prompt ---------- */
  const installBox = document.getElementById('install');
  const installBtn = document.getElementById('installBtn');
  const iosHint = document.getElementById('iosHint');
  let deferredPrompt = null;

  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (!isStandalone) {
    if (isIOS) {
      iosHint.hidden = false;
      installBox.classList.add('show');
    }

    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.hidden = false;
      installBox.classList.add('show');
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBox.classList.remove('show');
    });

    window.addEventListener('appinstalled', () => installBox.classList.remove('show'));
  }
})();
</script>
</body>
</html>
